<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List Search Prototype</title>
<link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined&display=block" rel="stylesheet">
<style>
/* Tokens and component styles copied from frontend-public:
   styles/_colors.scss, styles.scss (.text-highlight), shared/search-results, shared/search-record-item,
   shared/search-result-nothing-found, public/plot-info (as rendered on map.chronicle.rip, 28/10/2026) */
:root{
  --primary:#673AB7; --dark:#181429; --dark-60:rgba(24,20,41,.6); --dark-10:rgba(24,20,41,.1);
  --blue:#2F80ED; --green:#27AE60; --tile:#f5f5f5; --card:#f2f1f6;
  --label:#5c5868; /* type word: 6.4:1 on white */
}
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,"Helvetica Neue",sans-serif;color:var(--dark);background:#e9e7ee}
.mi{font-family:'Material Icons Outlined';font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;vertical-align:middle;text-transform:none;letter-spacing:normal;white-space:nowrap}
button,input,select{font-family:inherit;color:inherit}
a{color:inherit}

/* --- tool chrome (not part of the product) --- */
.tool{position:sticky;top:0;z-index:100;background:var(--dark);color:#fff;padding:8px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.tool b{font-weight:500;margin-right:8px}
.tool .grp{display:flex;gap:4px;align-items:center;margin-right:12px}
.tool .grp span{opacity:.6;margin-right:2px}
.tool a,.tool button{color:#fff;text-decoration:none;font-size:13px;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.12);border:none;cursor:pointer}
.tool .on{background:var(--primary)}
.note{max-width:1180px;margin:12px auto 0;padding:10px 14px;background:#fff8e1;border:1px solid #ffe08a;border-radius:6px;font-size:13px;line-height:1.5}
.note.q{background:#fdecef;border-color:#f6b8c2}
.phone-mode .note{max-width:390px}
.scn{display:none}.scn.on{display:block}

/* --- customer website around the embed (not ours) --- */
.site{max-width:1180px;margin:12px auto 40px;background:#f0f0f0;padding:20px 24px 24px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.site.phone{max-width:390px;padding:16px 10px 18px}
.site-h1{font-size:26px;font-weight:700;letter-spacing:3px;color:#2b2a3a;margin:0 0 14px}
.phone .site-h1{font-size:19px;letter-spacing:2px}
.site-ft{font-size:11px;color:#77737f;margin-top:8px}
.frame{background:#fff;border:1px solid #cfcfcf;outline:2px dashed #b39ddb;outline-offset:3px;position:relative;overflow:hidden}
.frame-tag{position:absolute;top:0;right:10px;background:#b39ddb;color:#fff;font-size:11px;padding:1px 8px;border-radius:0 0 8px 8px;z-index:20}
.orgbar{padding:18px 24px;border-bottom:1px solid #e6e6e6;font-weight:500;font-size:15px}
.phone .orgbar{padding:14px 16px}

/* --- list page --- */
.top{border-bottom:1px solid var(--dark-10);padding:16px 24px 18px;background:#fff}
.phone .top{padding:14px 16px 16px}
.hero{min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.phone .hero{min-height:440px;padding:24px 16px}
.hero h2{margin:0 0 14px;font-size:26px;font-weight:500}
.hero p{margin:0 0 22px;color:var(--dark-60);font-size:14px}
.hero .bar{width:100%;max-width:790px;text-align:left}
.bar{display:flex;gap:16px;align-items:flex-end}
.phone .bar{flex-direction:column;align-items:stretch;gap:12px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--dark)}
.fl.n{flex:1}
.fl.c{flex:0 0 250px}
.phone .fl.c{flex:none}
.sbox{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;border:1px solid #b9b6c3;border-radius:4px;background:#fff}
.sbox.focus{border:2px solid var(--primary);padding:0 11px}
.sbox .mi{color:#6b6876;font-size:20px}
.sbox input{border:none;outline:none;background:transparent;font-size:15px;flex:1;color:var(--dark);min-width:0;font-weight:400}
.sbox input::placeholder{color:#77737f}
.sbox .clr{cursor:pointer;color:#77737f;font-size:20px}
.csel{position:relative;height:46px;border:1px solid #b9b6c3;border-radius:4px;background:#fff;display:flex;align-items:center}
.csel select{appearance:none;border:none;background:transparent;font-size:15px;font-weight:400;width:100%;height:100%;padding:0 36px 0 12px;cursor:pointer;outline:none}
.csel .mi{position:absolute;right:10px;pointer-events:none;color:var(--dark);font-size:20px}
.btn{background:linear-gradient(#5e35b1,#4527a0);color:#fff;border:none;border-radius:4px;font-weight:500;font-size:14px;letter-spacing:1px;text-transform:uppercase;padding:0 28px;height:46px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.hdr{display:flex;justify-content:space-between;align-items:baseline;margin:20px 16px 4px}
.hdr h3{margin:0;font-size:28px;font-weight:500;color:var(--dark)}
.hdr .cnt{font-size:14px;color:var(--dark-60)}
.text-highlight{font-weight:bold}

.tile{width:40px;height:40px;border-radius:8px;background:var(--tile);display:flex;align-items:center;justify-content:center;flex:none}
.tile svg{width:24px;height:24px}
.mz{width:16px;height:16px;vertical-align:-3px;margin-left:4px}

table.res{width:100%;border-collapse:collapse}
.res th{text-align:left;font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--dark-60);padding:10px 12px;border-bottom:1px solid var(--dark-10);white-space:nowrap}
.res td{padding:14px 12px;border-bottom:1px solid var(--dark-10);vertical-align:middle;font-size:14px}
.res td.d{white-space:nowrap}
.res .nm{font-size:14px}
.res .cem{font-size:14px}
.found{font-size:13px;color:var(--dark-60);margin:16px 24px 6px}
.found b{color:var(--dark)}
.phone .found{margin:14px 16px 4px}
.tw{padding:0 12px}
.loc .t{display:block;font-size:11px;font-weight:500;letter-spacing:1px;color:var(--label);margin-bottom:2px}
.loc .c{font-size:14px}
.som{color:var(--primary);font-weight:500;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:44px;cursor:pointer;background:none;border:none;padding:0}
.som svg{width:20px;height:20px;transform:scaleX(-1)}
.nomap{color:var(--dark-60);font-size:13px}
.more{display:flex;justify-content:center;padding:20px}
.btn-s{background:#fff;color:var(--primary);border:1px solid rgba(103,58,183,.5);border-radius:4px;font-weight:500;font-size:14px;letter-spacing:1.25px;text-transform:uppercase;padding:0 24px;height:44px;cursor:pointer}
.end{text-align:center;color:var(--dark-60);font-size:13px;padding:16px}

.items .it{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--dark-10)}
.it .r{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.it .cn{font-size:14px;line-height:16px;color:var(--dark-60)}
.it .nm{font-size:16px;font-weight:500}
.it .nm .text-highlight{font-weight:700}
.it .dt{font-size:14px;color:var(--dark-60)}
.it .ft{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:2px}
.it .som{min-height:40px;margin-bottom:-10px}

.none{text-align:center;display:flex;flex-direction:column;align-items:center;padding:0 24px 40px}
.none svg{width:80px;height:80px;margin:64px 0 24px}
.none h3{margin:0 0 12px;font-size:24px;font-weight:500;opacity:.6}
.none p{margin:0;font-size:16px;font-weight:500;opacity:.6;line-height:1.5;max-width:520px}
.none a{color:var(--primary);opacity:1}
.prog{height:4px;background:#d1c4e9;overflow:hidden;position:relative}
.prog::after{content:"";position:absolute;left:-40%;width:40%;top:0;bottom:0;background:var(--primary);animation:p 1.1s infinite}
@keyframes p{to{left:100%}}
.sk{display:flex;gap:14px;padding:16px;border-bottom:1px solid var(--dark-10)}
.sk i{display:block;height:12px;border-radius:6px;background:#eeedf2;margin:6px 0}
.err{display:flex;gap:12px;margin:24px 16px;padding:14px 16px;border-radius:6px;background:#fff5f6;border:1px solid #f3c2c8;font-size:14px;line-height:1.5}
.err .mi{color:#c4001a}

/* --- grave page (existing plot-info, inside the frame) --- */
.pv{display:grid;grid-template-columns:360px 1fr;height:640px;position:relative}
.phone .pv{display:block;height:720px}
.pv .side{overflow:auto;background:#fff;position:relative;z-index:2;box-shadow:2px 0 6px rgba(0,0,0,.06)}
.back{display:flex;align-items:center;gap:8px;padding:0 16px;height:52px;color:var(--primary);font-weight:500;font-size:14px;letter-spacing:1.25px;text-transform:uppercase;border:none;border-bottom:1px solid var(--dark-10);background:#fff;width:100%;cursor:pointer}
.back svg{width:22px;height:22px}
.photo{height:180px;background:#ececec;display:flex;align-items:center;justify-content:center;position:relative}
.photo>.mi{font-size:80px;color:#fff}
.x .mi{font-size:22px;color:#fff}
.x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;background:#5f5b66;color:#fff;display:flex;align-items:center;justify-content:center}
.pi{padding:18px 16px}
.pi .cn{font-size:14px;color:var(--dark-60)}
.pi h2{margin:2px 0 6px;font-size:28px;font-weight:700}
.pi .meta{display:flex;align-items:center;gap:8px;color:var(--dark-60);font-size:16px}
.pi .meta i{width:1px;height:18px;background:var(--dark-60)}
.acts{display:flex;align-items:center;gap:18px;margin:18px 0 20px}
.req{border:1px solid #ddd;border-radius:4px;height:46px;padding:0 18px;display:flex;align-items:center;gap:10px;color:var(--primary);font-weight:500;letter-spacing:1px;font-size:14px;flex:1;justify-content:center}
.acts .mi{color:var(--primary)}
.ppl{border:1px solid #ddd;border-radius:8px;padding:16px 18px;display:flex;align-items:center;margin-bottom:12px}
.ppl b{display:block;font-weight:500;font-size:17px;margin-bottom:6px}
.ppl span{color:var(--dark-60);font-size:15px}
.ppl .mi{margin-left:auto;color:var(--primary)}
.map{position:relative;background:#7a8f6a url('') center/cover no-repeat}
.phone .map{position:absolute;inset:0;background-position:30% 40%}
.mctl{position:absolute;right:12px;display:flex;flex-direction:column;gap:10px}
.mctl span{width:40px;height:40px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.zoom{position:absolute;right:12px;bottom:28px;background:#fff;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.zoom span{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.zoom span+span{border-top:1px solid #ddd}
.zl{position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.85);font-size:11px;padding:2px 6px;border-radius:3px}
.mnote{position:absolute;left:12px;top:12px;max-width:300px;background:#fdecef;border:1px solid #f6b8c2;color:#5b0f1d;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:4px}
.phone .backf{position:absolute;left:12px;top:12px;z-index:3;width:auto;height:44px;border:none;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.phone .mnote{top:66px}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;background:#fff;border-radius:16px;padding:12px 14px 14px;z-index:3;box-shadow:0 -2px 12px rgba(0,0,0,.2)}
.sheet .pc{display:flex;gap:10px;background:var(--card);border-radius:10px;padding:10px;margin-bottom:12px;overflow:auto}
.sheet .pc div{background:#fff;border-radius:8px;padding:10px 12px;min-width:120px;font-weight:500;font-size:15px}
.sheet h2{margin:2px 0 4px;font-size:26px}
.sheet .open{display:flex;justify-content:flex-end;color:var(--primary);font-weight:500;gap:6px;align-items:center;margin-top:6px}
.sr{position:absolute;left:-9999px}
.map{background:repeating-linear-gradient(25deg,transparent 0 70px,#d5dccd 71px 79px),repeating-linear-gradient(115deg,#91a783 0 45px,#617e59 46px 49px);}.map:after{content:"ILLUSTRATIVE MAP · NOT LIVE";position:absolute;left:30%;top:50%;background:white;padding:12px;border-radius:5px;color:#181429;}
</style>
</head>

      <input name="q" placeholder="First or last name" value="${esc(s.q||'')}" autocomplete="off">
      ${s.q?'<span class="mi clr" data-act="clear" title="Clear">close</span>':''}</span></label>
    ${cems.length>1?`<label class="fl c">Cemetery<span class="csel"><select name="cem"><option value="all">All cemeteries</option>${cems.map(c=>`<option ${s.cem===c?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="mi">expand_more</span></span></label>`:''}
    <button class="btn" type="submit">Search</button></form>`;
  const org = `<div class="orgbar">${cems.length>1?'Demo Cemetery Organisation':esc(cems[0])}</div>`;
  if(s.state==='before') return org + `<div class="hero"><h2>Find a burial record</h2><p>${cems.length>1?`Search all ${['','one','two','three','four','five'][cems.length]||cems.length} cemeteries by first or last name.`:'Search by first or last name.'}</p>${form}</div>`;
  return org + `<div class="top">${form}</div>`;
}
function vSom(r){ return r[6]&&r[7]!=='Unknown location' ? `<button class="som" data-act="map" data-i="${r.__i}" aria-label="Show ${esc(fullName(r))} on map">${ICON_ARROW}Show on map</button>` : '<span class="nomap">Not on map</span>'; }
function vTable(rows, s){
  const multi = (s.cems||CEMS).length>1, map = !s.nomap;
  return `<div class="tw"><table class="res"><thead><tr><th>Name</th><th>Born</th><th>Died</th>${multi?'<th>Cemetery</th>':''}<th>Location</th>${map?'<th><span class="sr">Map</span></th>':''}</tr></thead><tbody>${rows.map(r=>`
    <tr><td class="nm">${hl(fullName(r), s.q)}</td>
    <td class="d">${date(r[3])}</td><td class="d">${date(r[4])}</td>${multi?`<td class="cem">${esc(r[5])}</td>`:''}<td>${locHtml(r)}</td>${map?`<td>${vSom(r)}</td>`:''}</tr>`).join('')}</tbody></table></div>`;
}
function vItems(rows, s){
  const multi = (s.cems||CEMS).length>1, map = !s.nomap;
  return `<div class="items">${rows.map(r=>`<div class="it"><div class="r">
    <div class="nm">${hl(fullName(r), s.q)}</div>
    <div class="dt">Born ${date(r[3])} · Died ${date(r[4])}</div>
    ${multi?`<div class="cn">${esc(r[5])}</div>`:''}
    <div class="ft">${locHtml(r)}${map?vSom(r):''}</div></div></div>`).join('')}</div>`;
}
function vList(s){
  let body = '';
  if(s.state==='loading') body = `<div class="prog"></div>${'<div class="sk"><div class="tile"></div><div style="flex:1"><i style="width:30%"></i><i style="width:55%"></i></div></div>'.repeat(5)}`;
  else if(s.state==='error') body = `<div class="err"><span class="mi">error_outline</span><div><b>Search isn't working right now.</b><br>Please try again in a moment. If it keeps happening, call the office at <a href="tel:${OFFICE.tel}" style="color:var(--primary)">${OFFICE.label}</a>.</div></div>`;
  else if(s.state==='results'){
    const all = s.rows || search(s.q, s.cem).map(({r,i})=>Object.assign(r.slice(),{__i:i}));
    if(!all.length) body = `<div class="none">${ICON_LIST}<h3>No results for '${esc(s.q)}'</h3><p>Check the spelling, or try just the last name. Not every record is online.<br>For help, call the office at <a href="tel:${OFFICE.tel}">${OFFICE.label}</a>.</p></div>`;
    else {
      const rows = all.slice(0, s.shown||PAGE);
      body = `<div class="found">Results for <b>"${esc(s.q)}"</b></div>
        ${s.phone?vItems(rows,s):vTable(rows,s)}
        ${rows.length<all.length?'<div class="more"><button class="btn-s" data-act="more">Show more</button></div>':'<div class="end">End of results</div>'}`;
    }
  }
  return vSearchBar(s) + body;
}
function vPlot(s){
  const r = DATA[s.plot], same = DATA.filter(x=>x[6]===r[6]&&x[5]===r[5]);
  const note = s.k3232 ? '' : `<div class="mnote"><b>Prototype:</b> illustrative map only. No real cemetery imagery or live data is used.</div>`;
  const term = (new URLSearchParams((s.from||'').split('?')[1]||'').get('q')) || s.backq || '';
  const back = `<button class="back ${s.phone?'backf':''}" data-act="back">${ICON_ARROW}Back to results${term?` for "${esc(term)}"`:''}</button>`;
  if(s.phone) return `<div class="pv">${back}<div class="map">${note}<div class="mctl" style="top:12px"><span class="mi">tune</span><span class="mi">layers</span></div></div>
    <div class="sheet"><div class="pc">${same.map(p=>`<div>${esc(p[0])}<br>${esc(p[2])}</div>`).join('')}</div>
    <div class="cn" style="color:var(--dark-60);font-size:14px">${esc(r[5])}</div><h2>${esc(r[6])}</h2>
    <div class="meta" style="color:var(--dark-60)"><span class="mi" style="font-size:20px">person</span> ${same.length} / - &nbsp;|&nbsp; ${esc(r[7])}</div>
    <div class="open">Open ${ICON_ARROW.replace('<svg','<svg style="width:20px;transform:scaleX(-1)"')}</div></div></div>`;
  return `<div class="pv"><div class="side">${back}
    <div class="photo"><span class="mi">house_siding</span><span class="x"><span class="mi">close</span></span></div>
    <div class="pi"><div class="cn">${esc(r[5])}</div><h2>${esc(r[6])}</h2>
      <div class="meta"><span class="mi" style="font-size:20px">person</span>${same.length} / - <i></i> ${esc(r[7])} <i></i></div>
      <div class="acts"><div class="req"><span class="mi">format_list_bulleted</span>REQUESTS<span class="mi">expand_more</span></div><span class="mi">directions_walk</span><span class="mi">description</span><span class="mi">share</span></div>
      ${same.map(p=>`<div class="ppl"><div><b>${esc(fullName(p))}</b><span>${date(p[3])} - ${date(p[4])}</span></div><span class="mi">chevron_right</span></div>`).join('')}</div></div>
    <div class="map">${note}<div class="mctl" style="top:12px"><span class="mi">tune</span><span class="mi">layers</span></div>
      <div class="zoom"><span class="mi">add</span><span class="mi">remove</span></div><div class="zl">Zoom 23 (only when opened from the list)</div></div></div>`;
}
function vSite(inner, phone){
  return `<div class="site${phone?' phone':''}"><div class="site-h1">SEARCH OUR CEMETERIES</div>
  <div class="frame"><span class="frame-tag">Chronicle embed</span>${inner}</div><div class="site-ft">Grey page and heading: the customer's website, not ours.</div></div>`;
}
const view = s => vSite(s.view==='plot' ? vPlot(s) : vList(s), s.phone);

/* ---------- prototype ---------- */
const P = {phone:false, slow:false, fail:false, single:false};
function parse(){
  const h = location.hash.slice(1) || '/';
  const [path, qs] = h.split('?'); const p = new URLSearchParams(qs||'');
  return {path, q:p.get('q')||'', cem:p.get('cem')||'all', shown:+(p.get('n')||PAGE), from:p.get('from')||''};
}
let pending = null;
function renderProto(){
  const r = parse(), app = document.getElementById('app');
  const cems = P.single ? ['Meadow Demo Cemetery'] : CEMS;
  const cem = P.single ? 'Meadow Demo Cemetery' : r.cem;
  let s;
  if(r.path.startsWith('/plot/')) s = {view:'plot', plot:+r.path.split('/')[2], phone:P.phone, from:r.from};
  else if(r.path==='/search' && r.q) s = {state: pending===location.hash ? (P.fail?'error':'loading') : 'results', q:r.q, cem, cems, shown:r.shown, phone:P.phone};
  else s = {state:'before', phone:P.phone, cems, cem};
  app.innerHTML = toolbar() + `<div class="${P.phone?'phone-mode':''}"><div class="note">Prototype only — fictional data, no live API. Clickable prototype. Search any name from the fictional sample (e.g. Demo, Sample, Alex, or a plot ID like "DEMO 001"). The page address holds the search, so the browser's Back button works. Grey/pink boxes are notes, not product.</div>${view(s)}</div>`;
  const inp = app.querySelector('input[name=q]'); if(inp && s.state==='before') inp.focus();
}
function toolbar(){
  const t = (k,on,label)=>`<button data-tog="${k}" class="${on?'on':''}">${label}</button>`;
  return `<div class="tool"><b>Public list search: prototype</b>
    <div class="grp"><span>Device</span>${t('desk',!P.phone,'Desktop')}${t('phone',P.phone,'Phone')}</div>
    <div class="grp"><span>Org</span>${t('multi',!P.single,'3 cemeteries')}${t('single',P.single,'1 cemetery')}</div>
    <div class="grp"><span>Network</span>${t('fast',!P.slow&&!P.fail,'Normal')}${t('slow',P.slow,'Slow')}${t('fail',P.fail,'Error')}</div>
    <a href="#/" style="margin-left:auto">Restart</a></div>`;
}
function go(hash){
  const same = location.hash === '#'+hash;
  pending = (P.slow||P.fail) ? '#'+hash : null;
  location.hash = hash; if(same) renderProto();
  if(P.slow) setTimeout(()=>{ pending=null; renderProto(); }, 1200);
}
function bindProto(){
  addEventListener('hashchange', renderProto);
  document.addEventListener('submit', e => {
    e.preventDefault(); const f = e.target, q = f.q.value.trim(); if(!q) return;
    const cem = f.cem ? f.cem.value : 'all';
    go(`/search?q=${encodeURIComponent(q)}&cem=${encodeURIComponent(cem)}`);
  });
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act],[data-tog]'); if(!el) return;
    const tog = el.dataset.tog;
    if(tog){ if(tog==='desk')P.phone=false; if(tog==='phone')P.phone=true; if(tog==='multi')P.single=false; if(tog==='single')P.single=true;
      if(tog==='fast'){P.slow=false;P.fail=false;} if(tog==='slow'){P.slow=true;P.fail=false;} if(tog==='fail'){P.fail=true;P.slow=false;} pending=null; renderProto(); return; }
    const a = el.dataset.act, r = parse();
    if(a==='clear'){ location.hash = '#/'; }
    if(a==='more'){ location.hash = `/search?q=${encodeURIComponent(r.q)}&cem=${encodeURIComponent(r.cem)}&n=${r.shown+PAGE}`; }
    if(a==='map'){ location.hash = `/plot/${el.dataset.i}?from=${encodeURIComponent(location.hash.slice(1))}`; }
    if(a==='back'){ location.hash = r.from || '/'; }
  });
}

/* ---------- boot ---------- */
bindProto(); renderProto();
</script>
</body>
</html>
